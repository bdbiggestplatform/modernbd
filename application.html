<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Portal | BDPlatform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        editorial: '#FAF9F6',
                        charcoal: '#1A1A1A',
                        gold: '#C59B27',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-editorial text-charcoal font-sans antialiased flex flex-col min-h-screen">

    <!-- Top Sticky Navigation Bar -->
    <header class="sticky top-0 z-40 bg-editorial/95 backdrop-blur-md border-b border-stone-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="h-16 sm:h-20 flex items-center justify-between">
                <a href="index.html" class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded bg-charcoal text-editorial flex items-center justify-center font-serif font-bold text-lg">B</div>
                    <span class="font-serif font-bold text-xl tracking-tight text-charcoal">BD<span class="text-gold">Platform</span></span>
                </a>

                <!-- Desktop Menu -->
                <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-stone-600">
                    <a href="index.html" class="hover:text-charcoal transition">Home</a>
                    <a href="index.html#career" class="hover:text-charcoal transition">Career</a>
                    <a href="application.html" class="text-charcoal font-semibold">Application</a>
                    <a href="contact.html" class="hover:text-charcoal transition">Contact</a>
                </nav>

                <a href="index.html" class="px-4 py-2 text-xs sm:text-sm font-medium bg-white border border-stone-300 text-charcoal rounded-lg hover:bg-stone-50 transition">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Back to Home
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-3xl mx-auto px-4 sm:px-6 py-16 w-full">
        <div class="bg-white rounded-2xl p-8 sm:p-12 border border-stone-200 shadow-xl">
            
            <div class="text-center mb-10">
                <span class="text-xs font-semibold uppercase tracking-widest text-gold bg-gold/10 px-3.5 py-1.5 rounded-full border border-gold/20 inline-block mb-3">
                    Application Portal
                </span>
                <h1 class="font-serif text-3xl font-bold text-charcoal">BD Biggest Platform Ltd</h1>
                <p class="text-xs sm:text-sm text-stone-500 mt-1">Choose your preferred application method below</p>
            </div>

            <!-- Choice Box -->
            <div id="choiceContainer" class="space-y-4 max-w-md mx-auto">
                <a href="https://forms.gle/4ALKGsVbhxb226b97" target="_blank" class="flex items-center justify-center gap-3 w-full py-4 px-6 bg-emerald-600 text-white font-semibold rounded-xl hover:bg-emerald-700 transition shadow-md text-base">
                    <i class="fa-solid fa-file-lines"></i> 1. Google Form Application
                </a>
                
                <button type="button" onclick="openDirectForm()" class="flex items-center justify-center gap-3 w-full py-4 px-6 bg-charcoal text-editorial font-semibold rounded-xl hover:bg-stone-800 transition shadow-md text-base">
                    <i class="fa-solid fa-pen-to-square text-gold"></i> 2. Direct Form Application
                </button>
            </div>

            <!-- Dynamic Form Area -->
            <div id="applicationBox" class="mt-8"></div>

        </div>
    </main>
        <!-- Footer -->
    <footer class="bg-charcoal text-stone-400 py-8 px-4 text-center text-xs border-t border-stone-800">
        <div class="max-w-7xl mx-auto">
            <p>&copy; 2026 BDPlatform. All rights reserved. Global Talent Studio.</p>
        </div>
    </footer>

    <!-- Script Handling Direct Form & Google Script Integration -->
    <script>
    function openDirectForm() {
        // Hide choice buttons once direct form is opened
        document.getElementById("choiceContainer").style.display = "none";
        
        document.getElementById("applicationBox").innerHTML = `
            <div class="border-t border-stone-200 pt-8 mt-6">
                <h2 class="font-serif text-2xl font-bold text-charcoal mb-6 text-center">Direct Application Form</h2>

                <form id="directApplicationForm" class="space-y-5 text-left">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1.5">Full Name</label>
                        <input type="text" name="full_name" required placeholder="Enter your full name" class="w-full px-4 py-3 text-sm bg-editorial border border-stone-200 rounded-xl focus:outline-none focus:border-charcoal transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1.5">Address</label>
                        <textarea name="address" rows="3" required placeholder="Enter your current address" class="w-full px-4 py-3 text-sm bg-editorial border border-stone-200 rounded-xl focus:outline-none focus:border-charcoal transition"></textarea>
                    </div>

                    <div class="grid sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1.5">Date of Birth</label>
                            <input type="date" name="date_of_birth" required class="w-full px-4 py-3 text-sm bg-editorial border border-stone-200 rounded-xl focus:outline-none focus:border-charcoal transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1.5">Phone Number</label>
                            <input type="tel" name="phone_number" required placeholder="+880 1XXX-XXXXXX" class="w-full px-4 py-3 text-sm bg-editorial border border-stone-200 rounded-xl focus:outline-none focus:border-charcoal transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1.5">Educational Qualification</label>
                        <textarea name="educational_qualification" rows="2" required placeholder="e.g. B.Sc in CSE, University name" class="w-full px-4 py-3 text-sm bg-editorial border border-stone-200 rounded-xl focus:outline-none focus:border-charcoal transition"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1.5">Post</label>
                        <select name="post" required class="w-full px-4 py-3 text-sm bg-editorial border border-stone-200 rounded-xl focus:outline-none focus:border-charcoal transition">
                            <option value="">Select Post</option>
                            <option value="Story Writing">Story Writing</option>
                            <option value="Client Handling">Client Handling</option>
                            <option value="Story Management">Story Management</option>
                            <option value="Website Handling">Website Handling</option>
                            <option value="Deal with">Deal with</option>
                            <option value="HR Department">HR Department</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1.5">Contact Information</label>
                        <input type="text" name="contact_info" placeholder="WhatsApp / IMO / Gmail" required class="w-full px-4 py-3 text-sm bg-editorial border border-stone-200 rounded-xl focus:outline-none focus:border-charcoal transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1.5">Marital Status</label>
                        <select name="marital_status" required class="w-full px-4 py-3 text-sm bg-editorial border border-stone-200 rounded-xl focus:outline-none focus:border-charcoal transition">
                            <option value="">Select Status</option>
                            <option value="Single">Single</option>
                            <option value="In a relationship">In a relationship</option>
                            <option value="Married">Married</option>
                            <option value="Divorced">Divorced</option>
                            <option value="Widow">Widow</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1.5">Picture</label>
                        <input type="file" name="picture" accept="image/*" required class="w-full px-3 py-2 text-sm bg-editorial border border-stone-200 rounded-xl file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-charcoal file:text-editorial hover:file:bg-stone-800 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1.5">CV</label>
                        <input type="file" name="cv" accept=".pdf,.doc,.docx" class="w-full px-3 py-2 text-sm bg-editorial border border-stone-200 rounded-xl file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-charcoal file:text-editorial hover:file:bg-stone-800 transition">
                    </div>

                    <button type="submit" class="submit-btn w-full py-4 mt-4 bg-charcoal text-editorial font-semibold rounded-xl hover:bg-stone-800 transition shadow-md text-base">
                        Submit Application
                    </button>
                </form>
            </div>
        `;
    }
     
    document.addEventListener("submit", async function(event) {
        if (event.target.id !== "directApplicationForm") return;

        event.preventDefault();

        const form = event.target;
        const button = form.querySelector(".submit-btn");

        button.disabled = true;
        button.textContent = "Submitting application...";

        const pictureFile = form.picture.files[0];
        const cvFile = form.cv.files[0];

        const readFile = (file) => {
            return new Promise((resolve) => {
                if (!file) {
                    resolve("");
                    return;
                }
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.readAsDataURL(file);
            });
        };

        const picture = await readFile(pictureFile);
        const cv = await readFile(cvFile);

        const data = {
            fullName: form.full_name.value,
            address: form.address.value,
            dateOfBirth: form.date_of_birth.value,
            phoneNumber: form.phone_number.value,
            educationalQualification: form.educational_qualification.value,
            post: form.post.value,
            contactInformation: form.contact_info.value,
            maritalStatus: form.marital_status.value,
            picture: picture,
            cv: cv
        };

        try {
            await fetch(
                "https://script.google.com/macros/s/AKfycbxVmW-0fb3_WFAj3bCzy9W9PBr4IzhcCdJOcFYaxjnA3YUCO_sD4aLHSrYTScDIJqx5/exec",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify(data)
                }
            );

            alert("Application submitted successfully!");
            form.reset();

        } catch (error) {
            alert("Submission failed. Please try again.");
            console.error(error);
        }

        button.disabled = false;
        button.textContent = "Submit Application";
    });
    </script>
</body>
    </html>
