                  let combinedApplicants = [...presetApplicants];
        let currentPage = 1;

        function buildUniqueList(liveData) {
            const seenIds = new Set();
            const result = [];

            for (const item of presetApplicants) {
                const cleanId = String(item.id || "").trim().toUpperCase();
                if (!cleanId || seenIds.has(cleanId)) continue;
                seenIds.add(cleanId);
                result.push({
                    id: cleanId,
                    name: String(item.name || "").trim()
                });
            }

            if (Array.isArray(liveData)) {
                for (const row of liveData) {
                    const cleanId = String(row.trackingId || "").trim().toUpperCase();
                    const cleanName = String(row.fullName || "").trim();
                    if (!cleanId || !cleanName || seenIds.has(cleanId)) continue;
                    seenIds.add(cleanId);
                    result.push({
                        id: cleanId,
                        name: cleanName
                    });
                }
            }

            return result;
        }

        function onSearchInput() {
            currentPage = 1;
            renderPage();
        }

        function goToPage(pageNum) {
            currentPage = pageNum;
            renderPage();
            document.getElementById("applicantListContainer").scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function renderPage() {
            const q = document.getElementById("searchListInput").value.trim().toLowerCase();
            const container = document.getElementById("applicantListContainer");
            const countText = document.getElementById("totalCountText");
            const pageInfoText = document.getElementById("pageInfoText");
            const pageButtons = document.getElementById("pageButtons");

            const filtered = combinedApplicants.filter(item =>
                item.id.toLowerCase().includes(q) || item.name.toLowerCase().includes(q)
            );

            const totalPages = Math.max(1, Math.ceil(filtered.length / ITEMS_PER_PAGE));
            if (currentPage > totalPages) {
                currentPage = totalPages;
            }

            const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIdx = startIdx + ITEMS_PER_PAGE;
            const pageItems = filtered.slice(startIdx, endIdx);

            countText.textContent = `মোট এপ্লাই কারী: ${combinedApplicants.length} জন | মোট পেজ: ${totalPages}`;

            if (!filtered.length) {
                container.innerHTML = `<div class="p-8 text-center text-sm text-stone-500">No matching applicants found.</div>`;
                pageInfoText.textContent = "Showing 0 results";
                pageButtons.innerHTML = "";
                return;
            }

            container.innerHTML = pageItems.map(item => `
                <div class="grid grid-cols-12 px-4 sm:px-6 py-3.5 items-center hover:bg-editorial transition text-sm">
                    <div class="col-span-5 sm:col-span-4 font-mono font-bold text-charcoal">${item.id}</div>
                    <div class="col-span-7 sm:col-span-8 font-medium text-charcoal">${item.name}</div>
                </div>
            `).join("");

            pageInfoText.textContent = `Page ${currentPage} of ${totalPages} (${startIdx + 1}–${Math.min(endIdx, filtered.length)} of ${filtered.length})`;

            let buttonsHtml = `
                <button type="button" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? "disabled" : ""} class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-stone-300 bg-white text-charcoal disabled:opacity-40 hover:bg-stone-50 transition">
                    Prev
                </button>
            `;

            for (let p = 1; p <= totalPages; p++) {
                const activeClass = p === currentPage
                    ? "bg-charcoal text-editorial border-charcoal"
                    : "bg-white text-charcoal border-stone-300 hover:bg-stone-50";
                buttonsHtml += `
                    <button type="button" onclick="goToPage(${p})" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold border ${activeClass} transition">
                        ${p}
                    </button>
                `;
            }

            buttonsHtml += `
                <button type="button" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? "disabled" : ""} class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-stone-300 bg-white text-charcoal disabled:opacity-40 hover:bg-stone-50 transition">
                    Next
                </button>
            `;

            pageButtons.innerHTML = buttonsHtml;
        }

        async function loadApplicantsList() {
            combinedApplicants = buildUniqueList([]);
            renderPage();

            try {
                const res = await fetch(`${SCRIPT_URL}?action=adminList`);
                const data = await res.json();
                combinedApplicants = buildUniqueList(data);
                renderPage();
            } catch (err) {
                console.error("Live applicants load failed:", err);
            }
        }

        loadApplicantsList();
    </script>
